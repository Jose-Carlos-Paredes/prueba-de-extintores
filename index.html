<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Municipal - Control de Extintores</title>
    <!-- Librería para leer QR con la cámara -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        h1, h2 { text-align: center; color: #333; }
        
        .search-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn-qr {
            background-color: #007bff;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .btn-sync {
            background-color: #17a2b8;
            margin-bottom: 20px;
        }
        #reader { width: 100%; display: none; margin-bottom: 10px; }

        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button.action-btn {
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .oculto { display: none; }
        #diagnostico { padding: 15px; border-radius: 4px; font-weight: bold; margin-top: 15px;}
        
        .alerta-roja { background-color: #ffcccc; color: #cc0000; border: 1px solid #cc0000;}
        .alerta-amarilla { background-color: #fff3cd; color: #856404; border: 1px solid #856404;}
        .alerta-verde { background-color: #d4edda; color: #155724; border: 1px solid #155724;}
        
        .toast {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestión de Extintores</h1>

        <!-- Botón para descargar datos de Google Sheets -->
        <button class="btn-qr btn-sync" onclick="sincronizarGoogleSheets()">🔄 Sincronizar Base de Datos (Google Sheets)</button>
        
        <div id="toastMensaje" class="toast"></div>

        <!-- MÓDULO DE BÚSQUEDA -->
        <div class="search-box">
            <button class="btn-qr" id="btnEscanear" onclick="iniciarEscaneo()">📷 Escanear Código QR</button>
            <div id="reader"></div>
            
            <p style="text-align: center; margin: 10px 0;">O ingresar N° Chasis manualmente:</p>
            
            <input type="text" id="buscarDni" placeholder="Ej: 81174">
            <button class="action-btn" style="background-color: #6c757d;" onclick="buscarPorDni()">🔍 Buscar Extintor</button>
        </div>

        <!-- FORMULARIO DE DATOS -->
        <form id="extintorForm" class="oculto">
            <h2>Datos del Equipo</h2>
            <label for="dniExtintor">N° de Chasis / DNI:</label>
            <input type="text" id="dniExtintor" readonly style="background-color: #e9ecef;">

            <label for="tipo">Tipo de Extintor:</label>
            <select id="tipo">
                <option value="ABC">Polvo ABC</option>
                <option value="CO2">CO2</option>
                <option value="HCFC">HCFC (Haloclean)</option>
                <option value="HS">Acero Inoxidable (HS)</option>
            </select>

            <label for="fabricacion">Año de Fabricación:</label>
            <input type="number" id="fabricacion" min="1980" max="2026" required>

            <label for="ultimaPH">Año de Última Prueba Hidráulica:</label>
            <input type="number" id="ultimaPH" min="1980" max="2026">

            <label for="ultimaRecarga">Fecha de Última Recarga:</label>
            <input type="date" id="ultimaRecarga" required>

            <button type="button" class="action-btn" onclick="registrarYEvaluar()">💾 Guardar Registro y Evaluar</button>
        </form>

        <!-- RESULTADO DEL DIAGNÓSTICO -->
        <div id="resultadoPanel" class="oculto">
            <div id="diagnostico"></div>
        </div>
    </div>

    <script>
        // --- SISTEMA DE MENSAJES ---
        function mostrarMensaje(mensaje, color = '#333') {
            const toast = document.getElementById('toastMensaje');
            toast.innerText = mensaje;
            toast.style.backgroundColor = color;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        // --- GESTIÓN DE BASE DE DATOS LOCAL ---
        function obtenerBaseDeDatos() {
            let db = localStorage.getItem('extintoresDB');
            if (!db) {
                db = {};
                localStorage.setItem('extintoresDB', JSON.stringify(db));
            }
            return JSON.parse(localStorage.getItem('extintoresDB'));
        }

        function guardarExtintor(dni, datos) {
            let db = obtenerBaseDeDatos();
            db[dni] = datos;
            localStorage.setItem('extintoresDB', JSON.stringify(db));
        }

        // --- SINCRONIZACIÓN CON GOOGLE SHEETS ---
        async function sincronizarGoogleSheets() {
            // ¡IMPORTANTE! Reemplaza el texto de abajo con tu enlace de Google Sheets publicado como CSV
            const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSwZg3UdZkIYErHpe6jgpjHJ9Kd_tGUKs5hYHQDMmakLTT6HBe4CC88gqWkr_ydw0GH2eOG-Eh-b0a7/pub?output=csv"; 
            
            mostrarMensaje("Conectando con Google Sheets...", "#17a2b8");

            try {
                const respuesta = await fetch(urlCSV);
                const datosCSV = await respuesta.text();

                const lineas = datosCSV.split(/\r?\n/); // Divide por saltos de línea
                let db = {};

                for(let i = 1; i < lineas.length; i++) {
                    if(!lineas[i].trim()) continue;
                    
                    const columnas = lineas[i].split(',');
                    const dni = columnas[0].trim();
                    
                    db[dni] = {
                        tipo: columnas[1].trim(),
                        fabricacion: parseInt(columnas[2].trim()),
                        ultimaPH: parseInt(columnas[3].trim()),
                        ultimaRecarga: columnas[4].trim()
                    };
                }

                localStorage.setItem('extintoresDB', JSON.stringify(db));
                mostrarMensaje("✓ Base de datos actualizada con éxito desde Excel.", "#28a745");

            } catch (error) {
                console.error(error);
                mostrarMensaje("⚠ Error al conectar con la planilla.", "#cc0000");
            }
        }

        // --- LÓGICA DEL ESCÁNER QR ---
        let html5QrcodeScanner;
        function iniciarEscaneo() {
            document.getElementById('reader').style.display = 'block';
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                config,
                (textoDecodificado) => {
                    html5QrcodeScanner.stop();
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('buscarDni').value = textoDecodificado;
                    buscarPorDni();
                },
                (error) => { /* ignorar errores silenciosos */ }
            ).catch(err => alert("Error de cámara. Asegúrese de dar permisos."));
        }

        // --- LÓGICA DE BÚSQUEDA ---
        function buscarPorDni() {
            const dni = document.getElementById('buscarDni').value.trim();
            if (!dni) {
                mostrarMensaje("Por favor ingrese un número.", "#cc0000");
                return;
            }

            const db = obtenerBaseDeDatos();
            const form = document.getElementById('extintorForm');
            document.getElementById('resultadoPanel').classList.add('oculto');
            form.classList.remove('oculto');
            document.getElementById('dniExtintor').value = dni;

            if (db[dni]) {
                document.getElementById('tipo').value = db[dni].tipo;
                document.getElementById('fabricacion').value = db[dni].fabricacion;
                document.getElementById('ultimaPH').value = db[dni].ultimaPH;
                document.getElementById('ultimaRecarga').value = db[dni].ultimaRecarga;
                mostrarMensaje("✓ Extintor encontrado en la base de datos.", "#28a745");
            } else {
                document.getElementById('fabricacion').value = "";
                document.getElementById('ultimaPH').value = "";
                document.getElementById('ultimaRecarga').value = "";
                mostrarMensaje("⚠ Extintor no registrado. Complete los datos.", "#856404");
            }
        }

        // --- LÓGICA DE CÁLCULO ---
        function registrarYEvaluar() {
            const dni = document.getElementById('dniExtintor').value;
            const tipo = document.getElementById('tipo').value;
            const fabricacion = parseInt(document.getElementById('fabricacion').value);
            const ultimaPH = parseInt(document.getElementById('ultimaPH').value) || fabricacion;
            const ultimaRecargaInput = document.getElementById('ultimaRecarga').value;
            
            if(!fabricacion || !ultimaRecargaInput) {
                mostrarMensaje("Complete el año de fabricación y la fecha de recarga.", "#cc0000");
                return;
            }

            guardarExtintor(dni, { tipo, fabricacion, ultimaPH, ultimaRecarga: ultimaRecargaInput });
            mostrarMensaje("💾 Registro guardado exitosamente.", "#28a745");

            const fechaRecarga = new Date(ultimaRecargaInput);
            const hoy = new Date();
            const anioActual = hoy.getFullYear();

            let estado = "Operativo";
            let claseAlerta = "alerta-verde";
            let acciones = [];

            // 1. Descarte a los 20 años
            const edadExtintor = anioActual - fabricacion;
            if (edadExtintor >= 20) {
                estado = "DESCARTE DEFINITIVO";
                claseAlerta = "alerta-roja";
                acciones.push(`Superó los 20 años de vida útil (${edadExtintor} años de antigüedad). Dar de baja.`);
            } else {
                // 2. Prueba hidráulica cada 5 años
                if ((anioActual - ultimaPH) >= 5) {
                    estado = "PRUEBA HIDRÁULICA VENCIDA";
                    claseAlerta = "alerta-roja";
                    acciones.push("Se requieren pruebas de presión (pasaron 5 años o más).");
                }
                // 3. Recarga Anual
                const unAnioEnMilisegundos = 1000 * 60 * 60 * 24 * 365;
                if ((hoy - fechaRecarga) >= unAnioEnMilisegundos) {
                    if (estado === "Operativo") {
                        estado = "RECARGA ANUAL VENCIDA";
                        claseAlerta = "alerta-amarilla";
                    }
                    acciones.push("Necesita vaciado y recarga anual.");
                }
            }

            if (acciones.length === 0) {
                acciones.push(`Equipo en regla. Apto hasta el ${anioActual + 1} o hasta sus 20 años (Año ${fabricacion + 20}).`);
            }

            const panel = document.getElementById('resultadoPanel');
            const divDiagnostico = document.getElementById('diagnostico');
            
            panel.classList.remove('oculto');
            divDiagnostico.className = claseAlerta;
            divDiagnostico.innerHTML = `<h3>Resultado de Inspección</h3>
                                        <strong>Estado: ${estado}</strong><br><br>
                                        <strong>Acciones requeridas:</strong>
                                        <ul>` + acciones.map(a => `<li>${a}</li>`).join('') + `</ul>`;
        }
    </script>
</body>
</html>
